<div class="lg:pl-32 px-4 pt-6 pl-16">
    <!-- Titre principal -->
    <div class="text-white mb-6 mt-4">
        <h1 class="text-2xl font-bold">Server Settings: Survival World</h1>
        <h2 class="text-xl text-gray-400">Dashboard</h2>
    </div>



    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-5xl">

            <div class="flex flex-col md:flex-row justify-center items-stretch gap-12 md:mx-auto md:max-w-3xl">

                <!-- Card Server Status (gauche) -->
                <section class="w-full md:flex-1 rounded-xl bg-[#222931] p-8 shadow">
                    <h1 class="text-2xl text-white mb-4">Server Status</h1>

                    <div class="space-y-1 mb-6">
                        <div class="flex items-center gap-2 justify-between">
                            <div>
                                <span *ngIf="status == 'Running'" class="text-[#63BF68] font-medium">{{ status }}</span>
                                <span *ngIf="status == 'Stopped'" class="text-[#BF6363] font-medium">{{ status }}</span>
                            </div>
                            <!-- logos -->
                            <div>
                                <svg *ngIf="status == 'Running'"
                                    class="h-5 w-5 flex justify-end http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                                    <path fill="#63bf68"
                                        d="M530.8 134.1C545.1 144.5 548.3 164.5 537.9 178.8L281.9 530.8C276.4 538.4 267.9 543.1 258.5 543.9C249.1 544.7 240 541.2 233.4 534.6L105.4 406.6C92.9 394.1 92.9 373.8 105.4 361.3C117.9 348.8 138.2 348.8 150.7 361.3L252.2 462.8L486.2 141.1C496.6 126.8 516.6 123.6 530.9 134z" />
                                </svg>
                                <svg *ngIf="status == 'Stopped'"
                                    class="h-5 w-5 flex justify-end http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                                    <path fill="#bf6363"
                                        d="M183.1 137.4C170.6 124.9 150.3 124.9 137.8 137.4C125.3 149.9 125.3 170.2 137.8 182.7L275.2 320L137.9 457.4C125.4 469.9 125.4 490.2 137.9 502.7C150.4 515.2 170.7 515.2 183.2 502.7L320.5 365.3L457.9 502.6C470.4 515.1 490.7 515.1 503.2 502.6C515.7 490.1 515.7 469.8 503.2 457.3L365.8 320L503.1 182.6C515.6 170.1 515.6 149.8 503.1 137.3C490.6 124.8 470.3 124.8 457.8 137.3L320.5 274.7L183.1 137.4z" />
                                </svg>

                            </div>
                        </div>

                        <div class="mb-8">
                            <div class="flex flex-col sm:flex-row gap-4 sm:gap-12">
                                <!-- Uptime et IP -->
                                <div class="space-y-1">
                                    <p class="text-gray-300">Uptime: <span class="text-gray-400">{{ uptime }}</span></p>

                                </div>
                                <!-- Players -->
                                <div class="space-y-1">
                                    <p class="text-gray-300">Players</p>
                                    <p class="text-gray-400 text-lg">{{ players }}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between">
                        <div>
                            <div>
                                <button *ngIf="status == 'Running'"
                                    class="flex-1 sm:flex-none px-10 py-2.5 text-sm font-semibold rounded-lg bg-[#BF6363] text-white hover:bg-[#6c747b] transition-colors">
                                    Stop
                                </button>
                            </div>
                            <div>
                                <button *ngIf="status == 'Stopped'"
                                    class="flex-1 sm:flex-none px-10 py-2.5 text-sm font-semibold rounded-lg bg-[#63BF68] text-white hover:bg-[#69C96F] transition-colors">
                                    Start
                                </button>
                            </div>
                        </div>

                        <div>
                            <button [disabled]="status == 'Stopped'"
                                class="flex-1 sm:flex-none px-10 py-2.5 text-sm font-semibold rounded-lg bg-[#63BF68] text-white hover:bg-[#69C96F] transition-colors">
                                Restart
                            </button>
                        </div>
                    </div>

                    <div class="flex justify-end mt-4">
                        <button
                            class="px-3 py-1 text-xs font-semibold rounded-lg bg-[#5E656B] text-white hover:bg-[#69C96F] transition-colors">
                            View logs
                        </button>
                    </div>
                    <div class="bg-gray-700 w-auto mx-12 mt-6 h-0.5 rounded"></div>
                    <div class="text-2xl text-white mb-4 mt-4">
                        <div>
                            <h1>Resource Usage</h1>
                            <div class=" w-60 h-2 mt-4 ">
                                <div class="">
                                    <svg xmlns="http://www.w3.org/2000/svg" height="14" width="14" viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M240 88C240 74.7 229.3 64 216 64C202.7 64 192 74.7 192 88L192 128C156.7 128 128 156.7 128 192L88 192C74.7 192 64 202.7 64 216C64 229.3 74.7 240 88 240L128 240L128 296L88 296C74.7 296 64 306.7 64 320C64 333.3 74.7 344 88 344L128 344L128 400L88 400C74.7 400 64 410.7 64 424C64 437.3 74.7 448 88 448L128 448C128 483.3 156.7 512 192 512L192 552C192 565.3 202.7 576 216 576C229.3 576 240 565.3 240 552L240 512L296 512L296 552C296 565.3 306.7 576 320 576C333.3 576 344 565.3 344 552L344 512L400 512L400 552C400 565.3 410.7 576 424 576C437.3 576 448 565.3 448 552L448 512C483.3 512 512 483.3 512 448L552 448C565.3 448 576 437.3 576 424C576 410.7 565.3 400 552 400L512 400L512 344L552 344C565.3 344 576 333.3 576 320C576 306.7 565.3 296 552 296L512 296L512 240L552 240C565.3 240 576 229.3 576 216C576 202.7 565.3 192 552 192L512 192C512 156.7 483.3 128 448 128L448 88C448 74.7 437.3 64 424 64C410.7 64 400 74.7 400 88L400 128L344 128L344 88C344 74.7 333.3 64 320 64C306.7 64 296 74.7 296 88L296 128L240 128L240 88zM224 192L416 192C433.7 192 448 206.3 448 224L448 416C448 433.7 433.7 448 416 448L224 448C206.3 448 192 433.7 192 416L192 224C192 206.3 206.3 192 224 192zM240 240L240 400L400 400L400 240L240 240z"/></svg>
                                </div>
                                <div class="relative">
                                <div class="absolute inset-0 w-full h-2 bg-[#2E3742] rounded"></div>
                                <div class="absolute inset-0 w-[75%] h-2 bg-green-500 rounded"></div>
                            </div>
                            </div>
                        </div>
                    </div>
                </section>



                <!-- Card Register (droite) -->
                <section class="w-full md:flex-1 rounded-xl bg-[#222931] p-8 shadow">
                    <h1 class="text-2xl text-white mb-4">REGISTER</h1>

                    <div class="mb-4 space-y-2">
                        <input type="text"
                            class="bg-[#2C3540] text-[#9EA5AC] text-sm rounded-lg block w-full p-2.5 outline-none focus:ring-0"
                            placeholder="Username" />
                        <input type="email"
                            class="bg-[#2C3540] text-[#9EA5AC] text-sm rounded-lg block w-full p-2.5 outline-none focus:ring-0"
                            placeholder="Email..." />
                        <input type="password"
                            class="bg-[#2C3540] text-[#9EA5AC] text-sm rounded-lg block w-full p-2.5 outline-none focus:ring-0"
                            placeholder="Password..." />
                    </div>

                    <!-- Barre sous le password -->
                    <div class="relative w-full h-2 mb-4">
                        <div class="absolute inset-0 w-full h-2 bg-gray-300 rounded"></div>
                        <div class="absolute inset-0 w-[25%] h-2 bg-green-500 rounded"></div>
                    </div>

                    <div>
                        <input type="password"
                            class="bg-[#2C3540] text-[#9EA5AC] text-sm rounded-lg block w-full p-2.5 outline-none focus:ring-0 mb-4"
                            placeholder="Confirm your password..." />
                    </div>

                    <div class="text-[#5E656B] text-xs mb-4">
                        <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="checkbox"
                                class="w-4 h-4 accent-green-500 bg-[#2B333B] border border-[#5E656B] rounded focus:ring-0 focus:outline-none" />
                            <p>I agree to our Terms and conditions and Privacy policy</p>
                        </label>
                    </div>

                    <div class="space-y-2">
                        <button
                            class="bg-[#63BF68] text-white text-sm rounded-lg w-full p-2.5 hover:opacity-80 transition">
                            Register
                        </button>
                    </div>
                </section>

            </div>
        </div>
    </div>
