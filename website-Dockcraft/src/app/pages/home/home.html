<div class="lg:pl-32 px-4 pt-6 pl-16">
  <!-- Titre principal -->
  <div class="text-white mb-6 mt-4">
    <h1 class="text-2xl font-bold">Minecraft Container Manager</h1>
    <h2 class="text-xl text-gray-400">Dashboard</h2>
  </div>

  <!-- Top bar -->
  <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 mb-8">
    <!-- Search bar -->
    <div class="flex-1 max-w-sm">
      <div class="relative">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
          <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
            <path stroke="#9EA5AC" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
          </svg>
        </div>
        <input type="text" id="simple-search"
          class="bg-[#222931] border border-[#9EA5AC] text-[#9EA5AC] text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5"
          placeholder="Search container..." />
      </div>
    </div>

    <!-- Filter -->
    <div>
      <button class="text-[#9EA5AC] hover:text-white cursor-pointer font-medium inline-flex items-center">
        Filter by status
        <svg class="w-2.5 h-2.5 ms-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 10 6">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="m1 1 4 4 4-4" />
        </svg>
      </button>
    </div>

    <!-- New container button -->
    <div>
      <button type="button"
        class="w-full sm:w-auto focus:outline-none text-white bg-[#63BF68] hover:bg-[#69C96F] focus:ring-4 focus:ring-green-800 font-medium rounded-lg text-sm px-5 py-2.5">
        + New Container
      </button>
    </div>
  </div>

  <!-- Container Cards Grid -->
  <div class="max-w-7xl mx-auto">
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">


<app-server-card [name]="username" [players]="players" [ip]="ip" [image]="image" [status]="status" [uptime]="uptime"></app-server-card>
<app-server-card [name]="username" [players]="players" [ip]="ip" [image]="image" [status]="status2" [uptime]="uptime"></app-server-card>
    </div>
  </div>

</div>
