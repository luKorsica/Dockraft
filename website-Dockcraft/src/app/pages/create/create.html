<div class="min-h-screen p-8">
    <!-- Main Card -->
    <div class="bg-[#222931] backdrop-blur-sm rounded-2xl p-8 max-w-4xl">
        <!-- Container Icon and Title -->
        <div class="flex items-center gap-4 mb-8">
            <div class="bg-gray-700 rounded-full ">
                <svg width="4em" height="4em" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M827.3 461.5c-1.6-1.3-16.1-12.2-46.7-12.2-8.1 0-16.2.6-24.2 2.1-5.9-40.7-39.5-60.5-41-61.4l-8.2-4.8-5.4 7.8c-6.8 10.5-11.7 22-14.6 34.2-5.5 23.2-2.2 45 9.6 63.6-14.2 7.9-37.1 9.9-41.7 10H277c-9.9 0-17.9 8-17.9 17.9-.4 33.1 5.2 66 16.5 97.1 13 34.2 32.4 59.3 57.6 74.7 28.2 17.3 74.1 27.2 126.2 27.2 23.5.1 47-2.1 70.1-6.4 32.1-5.9 63-17.1 91.4-33.2 23.4-13.6 44.5-30.8 62.4-51.1 29.9-33.9 47.8-71.7 61.1-105.2h5.3c32.8 0 53-13.1 64.1-24.1 7.4-7 13.2-15.5 16.9-25l2.3-6.9-5.7-4.3zM312 489.9h50.7c2.4 0 4.4-2 4.4-4.4v-45.1c0-2.4-2-4.4-4.4-4.5H312c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.5 2 4.4 4.4 4.4m69.9 0h50.7c2.4 0 4.4-2 4.4-4.4v-45.1c0-2.4-2-4.4-4.4-4.5h-50.7c-2.5 0-4.5 2-4.5 4.5v45.1c0 2.5 2 4.4 4.5 4.4m70.8.1h50.7c2.4 0 4.4-2 4.4-4.4v-45.1c0-2.4-2-4.4-4.4-4.5h-50.7c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.4 2 4.3 4.4 4.4m70.1 0h50.7c2.4 0 4.4-2 4.5-4.4v-45.1c0-2.5-2-4.5-4.5-4.5h-50.7c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.4 1.9 4.4 4.4 4.4m-141-65h50.7c2.4 0 4.4-2 4.4-4.5v-45.1c0-2.4-2-4.4-4.4-4.4h-50.7c-2.5 0-4.4 2-4.5 4.4v45.1c.1 2.5 2.1 4.5 4.5 4.5m70.9 0h50.7c2.4 0 4.4-2 4.4-4.5v-45.1c0-2.4-2-4.4-4.4-4.4h-50.7c-2.4 0-4.4 2-4.4 4.4v45.1c0 2.5 2 4.5 4.4 4.5m70.1 0h50.7c2.5 0 4.4-2 4.5-4.5v-45.1c0-2.5-2-4.4-4.5-4.4h-50.7c-2.4 0-4.4 2-4.4 4.4v45.1c0 2.5 1.9 4.5 4.4 4.5m0-64.9h50.7c2.5 0 4.5-2 4.5-4.5v-45.2c0-2.4-2-4.4-4.5-4.4h-50.7c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.5 1.9 4.5 4.4 4.5M593.4 490h50.7c2.4 0 4.4-2 4.4-4.4v-45.1c0-2.5-2-4.4-4.4-4.5h-50.7c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.4 2 4.4 4.4 4.4"
                        style="fill:#fff" />
                </svg>
            </div>
            <h3 class="text-white text-xl font-semibold">Container informations</h3>
        </div>

        <div class="grid grid-cols-2 gap-6 ">
            <!-- Left Column -->
            <div class="space-y-6">
                <!-- World Name -->
                <div>
                    <input type="text" [(ngModel)]="worldName" placeholder="Name of your World..."
                        class="w-full bg-gray-700/50 text-white placeholder-gray-500 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 transition" />
                </div>

                <!-- Max Players -->
                <div>
                    <label class="text-gray-400 text-sm mb-2 block">Max Players</label>
                    <div class="flex items-center gap-2">
                        <input type="text" [(ngModel)]="maxPlayers" placeholder="Max players..."
                            class="w-full bg-gray-700/50 text-white placeholder-gray-500 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 transition" />
                    </div>
                </div>

                <!-- Admin Rights -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <label class="text-gray-400 text-sm">Admin Rights</label>
                        <button (click)="addAdmin()"
                            class="text-blue-400 hover:text-blue-300 text-sm transition flex items-center gap-1">
                            <span class="text-lg">+</span> Add New
                        </button>
                    </div>

                    <!-- Admin List -->
                    <div class="space-y-2 max-h-40 overflow-y-auto pr-2 custom-scrollbar">
                        <div *ngFor="let admin of adminList; let i = index"
                            class="flex items-center justify-between bg-gray-700/30 rounded-lg px-4 py-2.5 group hover:bg-gray-700/50 transition">
                            <span class="text-gray-300">{{ admin }}</span>
                            <button (click)="removeAdmin(i)"
                                class="text-red-500 hover:text-red-400 opacity-70 group-hover:opacity-100 transition">
                                ✕
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="space-y-6">
                <!-- Custom Select - Mod Loader -->
                <div class="flex gap-2 ">
                    <div class="flex-1">
                        <label class="text-gray-400 text-sm mb-2 block">Mod Loader</label>

                        <div class="relative mod-loader-dropdown">
                            <button type="button" (click)="toggleModLoaderDropdown()"
                                class="w-full bg-gray-700/50 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 transition flex items-center justify-between hover:bg-gray-700/70">
                                <span class="text-gray-300">{{ selectedModLoader || 'Select a mod loader...' }}</span>
                                <svg class="w-5 h-5 text-gray-400 transition-transform"
                                    [class.rotate-180]="isModLoaderOpen" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>

                            <!-- Dropdown Menu -->
                            <div *ngIf="isModLoaderOpen"
                                class="absolute z-10 w-full mt-2 bg-[#2a3139] rounded-lg shadow-xl border border-gray-600 overflow-hidden">
                                <div class="max-h-60 overflow-y-auto custom-scrollbar">
                                    <button *ngFor="let modLoader of modsLoader" type="button"
                                        (click)="selectModLoader(modLoader.viewValue)"
                                        class="w-full px-4 py-3 text-left text-gray-300 hover:bg-gray-700/50 transition flex items-center justify-between group">
                                        <span>{{ modLoader.viewValue }}</span>
                                        <svg *ngIf="selectedModLoader === modLoader.viewValue"
                                            class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor"
                                            viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M5 13l4 4L19 7" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex-1">
                        <label class="text-gray-400 text-sm mb-2 block">Version</label>

                        <div class="relative version-dropdown">
                            <button type="button" (click)="toggleVersionDropdown()"
                                class="w-full bg-gray-700/50 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 transition flex items-center justify-between hover:bg-gray-700/70">
                                <span class="text-gray-300">{{ selectedVersion || 'Select a version...' }}</span>
                                <svg class="w-5 h-5 text-gray-400 transition-transform"
                                    [class.rotate-180]="isVersionOpen" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>

                            <!-- Dropdown Menu -->
                            <div *ngIf="isVersionOpen"
                                class="absolute z-10 w-full mt-2 bg-[#2a3139] rounded-lg shadow-xl border border-gray-600 overflow-hidden">
                                <div class="max-h-60 overflow-y-auto custom-scrollbar">
                                    <button *ngFor="let version of versions" type="button"
                                        (click)="selectVersion(version.viewValue)"
                                        class="w-full px-4 py-3 text-left text-gray-300 hover:bg-gray-700/50 transition flex items-center justify-between group">
                                        <span>{{ version.viewValue }}</span>
                                        <svg *ngIf="selectedVersion === version.viewValue"
                                            class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor"
                                            viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M5 13l4 4L19 7" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Upload World File -->
                <div>
                    <label class="text-gray-400 text-sm mb-2 block">Already have a world file ?</label>
                    <div class="border-2 border-dashed border-gray-600 rounded-lg p-8 flex flex-col items-center justify-center hover:border-gray-500 transition cursor-pointer"
                        (click)="fileInput.click()">
                        <svg class="w-12 h-12 text-gray-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <input #fileInput type="file" class="hidden" (change)="onFileSelected($event)" />
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end gap-4 mt-8">
            <button class="bg-gray-600 hover:bg-gray-500 text-white px-8 py-2.5 rounded-lg transition font-medium">
                Back
            </button>
            <button class="bg-green-600 hover:bg-green-500 text-white px-8 py-2.5 rounded-lg transition font-medium">
                Save
            </button>
        </div>
    </div>
</div>
