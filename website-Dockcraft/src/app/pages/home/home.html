<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Container Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#161B22] p-8">
   
  <!-- Titre principal -->
  <div class="text-white mb-6">
    <h1 class="text-2xl font-bold">Minecraft Container Manager</h1>
    <h2 class="text-xl text-gray-400">Dashboard</h2>
  </div>

  <!-- Top bar -->
  <div class="flex items-center gap-4 mb-8">
    <!-- Search bar -->
    <div class="flex-1 max-w-sm">
      <div class="relative">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
          <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
            <path stroke="#9EA5AC" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
          </svg>
        </div>
        <input
          type="text"
          id="simple-search"
          class="bg-[#222931] border border-[#9EA5AC] text-[#9EA5AC] text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5"
          placeholder="Search container..."
        />
      </div>
    </div>

    <!-- Filter -->
    <div>
      <button class="text-[#9EA5AC] hover:text-white cursor-pointer font-medium inline-flex items-center">
        Filter by status
        <svg class="w-2.5 h-2.5 ms-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4" />
        </svg>
      </button>
    </div>

    <!-- New container button -->
    <div>
      <button
        type="button"
        class="focus:outline-none text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:ring-green-800 font-medium rounded-lg text-sm px-5 py-2.5">
        + New Container
      </button>
    </div>
  </div>

  <!-- Card -->
<div class="max-w-2xl">
  <div class="relative flex bg-[#222931] text-white rounded-2xl overflow-hidden shadow-lg">

    <!-- Barre verte latérale -->
    <div class="w-4 bg-green-500"></div>

    <!-- Logo Docker - Colonne séparée -->
    <div class="flex items-start pt-8 pl-6 pr-4">
      <div class="w-12 h-12 bg-[#2B333B] rounded-full flex items-center justify-center flex-shrink-0">
        <svg width="24" height="24" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M827.3 461.5c-1.6-1.3-16.1-12.2-46.7-12.2-8.1 0-16.2.6-24.2 2.1-5.9-40.7-39.5-60.5-41-61.4l-8.2-4.8-5.4 7.8c-6.8 10.5-11.7 22-14.6 34.2-5.5 23.2-2.2 45 9.6 63.6-14.2 7.9-37.1 9.9-41.7 10H277c-9.9 0-17.9 8-17.9 17.9-.4 33.1 5.2 66 16.5 97.1 13 34.2 32.4 59.3 57.6 74.7 28.2 17.3 74.1 27.2 126.2 27.2 23.5.1 47-2.1 70.1-6.4 32.1-5.9 63-17.1 91.4-33.2 23.4-13.6 44.5-30.8 62.4-51.1 29.9-33.9 47.8-71.7 61.1-105.2h5.3c32.8 0 53-13.1 64.1-24.1 7.4-7 13.2-15.5 16.9-25l2.3-6.9-5.7-4.3z"
            fill="#fff" />
        </svg>
      </div>
    </div>

    <!-- Contenu principal - Colonne de texte -->
    <div class="flex-2 py-8 pr-8">

      <!-- Titre et version -->
      <div class="flex items-center gap-3 mb-6">
        <h5 class="text-2xl font-bold">Survival World</h5>
        <span class="text-sm text-gray-400">Forge 1.21.1</span>
      </div>

      <!-- Status & Image -->
      <div class="space-y-1 mb-6">
        <!-- Status:Running -->
        <div class="flex items-center gap-2">
          <p class="text-gray-300">Status:</p>
          <span class="text-green-500 font-medium">Running</span>
          <div class="w-2 h-2 rounded-full bg-green-500"></div>
        </div>

        <!-- Image: test/survival:latest -->
        <div class="flex items-center gap-2">
          <p class="text-gray-300">Image:</p>
          <span class="text-gray-400">test/survival:lastest</span>
        </div>
      </div>

      <!-- Infos secondaires -->
      <div class="mb-8">
        <div class="flex">
          <!-- Colonne gauche: Uptime et IP -->
          <div class="space-y-1">
            <p class="text-gray-300">Uptime: <span class="text-gray-400">03:45:12</span></p>
            <p class="text-gray-300">IP: <span class="text-gray-400">play.serveur.me:25567/tcp</span></p>
          </div>

          <!-- Colonne droite: Players et 2/20 -->
          <div class="ml-32 space-y-1">
            <p class="text-gray-300">Players</p>
            <p class="text-gray-400 text-lg">2/20</p>
          </div>
        </div>
      </div>

      <!-- Boutons -->
      <div class="flex justify-between">
        <div class="flex gap-3">
          <!-- Stop -->
          <button
            (click)="stop()"
            class="px-6 py-2.5 text-sm font-semibold rounded-lg bg-[#5E656B] text-white hover:bg-[#6c747b] transition-colors">
            Stop
          </button>

          <!-- Restart -->
          <button
            (click)="restart()"
            class="px-6 py-2.5 text-sm font-semibold rounded-lg bg-[#5E656B] text-white hover:bg-[#6c747b] transition-colors">
            Restart
          </button>
        </div>

        <!-- Console à droite -->
        <button
          (click)="openConsole()"
          class="px-6 py-2.5 text-sm font-semibold rounded-lg bg-[#5E656B] text-white hover:bg-[#6c747b] transition-colors">
          Console
        </button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
