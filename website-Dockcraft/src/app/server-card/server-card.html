      <!-- Card 1 -->
      <div class="w-full">
        <div class="relative flex flex-col sm:flex-row bg-[#222931] text-white rounded-2xl overflow-hidden shadow-lg">
          <!-- Barre verte latérale -->
          <div *ngIf="status == 'Running'" class="h-5 sm:h-auto sm:w-6 bg-[#63BF68]"></div>
          <div *ngIf="status == 'Stopped'" class="h-5 sm:h-auto sm:w-6 bg-[#BF6363]"></div>

          <!-- Logo Docker -->
          <div class="flex items-start pt-6 sm:pt-8 px-6 sm:pl-6 sm:pr-4">
            <div class="w-12 h-12 bg-[#2B333B] rounded-full flex items-center justify-center flex-shrink-0">
              <svg class="w-8 h-8" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                <circle cx="512" cy="512" r="512" style="fill:#2C3540" />

                  d="M827.3 461.5c-1.6-1.3-16.1-12.2-46.7-12.2-8.1 0-16.2.6-24.2 2.1-5.9-40.7-39.5-60.5-41-61.4l-8.2-4.8-5.4 7.8c-6.8 10.5-11.7 22-14.6 34.2-5.5 23.2-2.2 45 9.6 63.6-14.2 7.9-37.1 9.9-41.7 10H277c-9.9 0-17.9 8-17.9 17.9-.4 33.1 5.2 66 16.5 97.1 13 34.2 32.4 59.3 57.6 74.7 28.2 17.3 74.1 27.2 126.2 27.2 23.5.1 47-2.1 70.1-6.4 32.1-5.9 63-17.1 91.4-33.2 23.4-13.6 44.5-30.8 62.4-51.1 29.9-33.9 47.8-71.7 61.1-105.2h5.3c32.8 0 53-13.1 64.1-24.1 7.4-7 13.2-15.5 16.9-25l2.3-6.9-5.7-4.3zM312 489.9h50.7c2.4 0 4.4-2 4.4-4.4v-45.1c0-2.4-2-4.4-4.4-4.5H312c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.5 2 4.4 4.4 4.4m69.9 0h50.7c2.4 0 4.4-2 4.4-4.4v-45.1c0-2.4-2-4.4-4.4-4.5h-50.7c-2.5 0-4.5 2-4.5 4.5v45.1c0 2.5 2 4.4 4.5 4.4m70.8.1h50.7c2.4 0 4.4-2 4.4-4.4v-45.1c0-2.4-2-4.4-4.4-4.5h-50.7c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.4 2 4.3 4.4 4.4m70.1 0h50.7c2.4 0 4.4-2 4.5-4.4v-45.1c0-2.5-2-4.5-4.5-4.5h-50.7c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.4 1.9 4.4 4.4 4.4m-141-65h50.7c2.4 0 4.4-2 4.4-4.5v-45.1c0-2.4-2-4.4-4.4-4.4h-50.7c-2.5 0-4.4 2-4.5 4.4v45.1c.1 2.5 2.1 4.5 4.5 4.5m70.9 0h50.7c2.4 0 4.4-2 4.4-4.5v-45.1c0-2.4-2-4.4-4.4-4.4h-50.7c-2.4 0-4.4 2-4.4 4.4v45.1c0 2.5 2 4.5 4.4 4.5m70.1 0h50.7c2.5 0 4.4-2 4.5-4.5v-45.1c0-2.5-2-4.4-4.5-4.4h-50.7c-2.4 0-4.4 2-4.4 4.4v45.1c0 2.5 1.9 4.5 4.4 4.5m0-64.9h50.7c2.5 0 4.5-2 4.5-4.5v-45.2c0-2.4-2-4.4-4.5-4.4h-50.7c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.5 1.9 4.5 4.4 4.5M593.4 490h50.7c2.4 0 4.4-2 4.4-4.4v-45.1c0-2.5-2-4.4-4.4-4.5h-50.7c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.4 2 4.4 4.4 4.4"
                  style="fill:#fff" />
              </svg>
            </div>
          </div>

          <!-- Contenu principal -->
          <div class="flex-1 py-6 sm:py-8 px-6 sm:pr-8">
            <!-- Titre et version -->
            <div class="flex flex-wrap items-center gap-3 mb-6">
              <h5 class="text-xl sm:text-2xl font-bold">{{name}}</h5>
              <span class="text-sm text-gray-400">Forge 1.21.1</span>

            </div>


            <!-- Status & Image -->
            <div class="space-y-1 mb-6">
              <div class="flex items-center gap-2">
                <p class="text-gray-300">Status:</p>
                <span *ngIf="status == 'Running'" class="text-[#63BF68] font-medium">{{ status }}</span>
                <span *ngIf="status == 'Stopped'" class="text-[#BF6363] font-medium">{{ status }}</span>
                
                <div  *ngIf="status == 'Running'" class="w-2 h-2 rounded-full bg-[#63BF68]"></div>
                <div  *ngIf="status == 'Stopped'" class="w-2 h-2 rounded-full bg-[#BF6363]"></div>
              </div>
              <div class="flex items-center gap-2">
                <p class="text-gray-300">Image:</p>
                <span class="text-gray-400 text-sm sm:text-base break-all">{{ image }}</span>
              </div>
            </div>

            <!-- Infos secondaires -->
            <div class="mb-8">
              <div class="flex flex-col sm:flex-row gap-4 sm:gap-12">
                <!-- Uptime et IP -->
                <div class="space-y-1">
                  <p class="text-gray-300">Uptime: <span class="text-gray-400">{{ uptime }}</span></p>
                  <p class="text-gray-300">IP: <span
                      class="text-gray-400 text-sm break-all">{{ ip }}</span></p>
                </div>
                <!-- Players -->
                <div class="space-y-1">
                  <p class="text-gray-300">Players</p>
                  <p class="text-gray-400 text-lg">{{ players }}</p>
                </div>
              </div>
            </div>

            <!-- Boutons -->
            <div class="flex flex-col sm:flex-row justify-between gap-3">
              <div class="flex gap-3">
                <button
                *ngIf="status == 'Running'"
                  class="flex-1 sm:flex-none px-6 py-2.5 text-sm font-semibold rounded-lg bg-[#BF6363] text-white hover:bg-[#DB7676] transition-colors">
                  Stop
                </button>
                <button
                *ngIf="status == 'Stopped'"
                  class="flex-1 sm:flex-none px-6 py-2.5 text-sm font-semibold rounded-lg bg-[#63BF68] text-white hover:bg-[#6BC972] transition-colors">
                  Start
                </button>

                <button
                  [disabled]="status == 'Stopped'"
                  class="flex-1 sm:flex-none px-6 py-2.5 text-sm font-semibold rounded-lg bg-[#5E656B] text-white hover:bg-[#6c747b] transition-colors">
                  Restart
                </button>
              </div>
              <button
                class="px-6 py-2.5 text-sm font-semibold rounded-lg bg-[#5E656B] text-white hover:bg-[#6c747b] transition-colors">
                Console
              </button>
            </div>
          </div>
        </div>
      </div>
