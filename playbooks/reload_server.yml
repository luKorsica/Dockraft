---
- name: OP un joueur via RCON
  hosts: localhost
  gather_facts: false
  vars:
    container_name: "chiara"
  
  tasks:
    - name: Récupérer le mot de passe RCON
      ansible.builtin.shell:
        cmd: "docker exec {{ container_name }} grep 'rcon.password=' /minecraft/server.properties | cut -d'=' -f2"
      register: rcon_password
      
    - name: Redemarrer le serveur via RCON
      ansible.builtin.shell:
        cmd: "docker exec {{ container_name }} mcrcon -H localhost -P 25575 -p '{{ rcon_password.stdout }}' 'reload'"
      register: op_result
      
    - name: Afficher le résultat
      ansible.builtin.debug:
        msg: "✅ Le serveur redemarre ! Résultat: {{ op_result.stdout }}"
        
    - name: Vérifier dans les logs
      ansible.builtin.command:
        cmd: "docker logs {{ container_name }} --tail 5"
      register: logs
      
    - name: Logs du serveur
      ansible.builtin.debug:
        var: logs.stdout_lines