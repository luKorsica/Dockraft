<div class="text-white">

    <h1 class="font-bold">Minecraft Container Manager</h1>
    <h2>Dashboard</h2>
</div>

<!-- Top bar -->
<div>

    <!-- Search bar -->
    <div class="bar-search">
        <form class="flex items-center max-w-sm mx-auto">
            <label for="simple-search" class="sr-only">Search</label>
            <div class="relative w-full">
                <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                    <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 20 20">
                        <path stroke="#9EA5AC" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
                    </svg>
                </div>
                <input type="text" id="simple-search"
                    class="bg-[222931] border border-[#9EA5AC] text-[#9EA5AC] text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5"
                    placeholder="Search container..." required />
            </div>
        </form>
    </div>

    <!-- filters -->
    <div class="bar-filter">
        <span id="dropdownDefaultButton" data-dropdown-toggle="dropdown"
            class="text-[#9EA5AC] hover:text-[#9EA5AC] cursor-pointer font-medium inline-flex items-center">
            Filter by status
            <svg class="w-2.5 h-2.5 ms-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 10 6">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="m1 1 4 4 4-4" />
            </svg>
        </span>
    </div>

    <!-- filters contents -->
    <div id="dropdown" class="z-10 hidden bg-white divide-y divide-gray-100 rounded-lg shadow-sm w-44">
        <ul class="py-2 text-sm text-gray-700" aria-labelledby="dropdownDefaultButton">
            <li>
                <a href="#"
                    class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Dashboard</a>
            </li>
            <li>
                <a href="#"
                    class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Settings</a>
            </li>
            <li>
                <a href="#"
                    class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Earnings</a>
            </li>
            <li>
                <a href="#" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Sign
                    out</a>
            </li>
        </ul>
    </div>

    <!-- New container button -->
    <div class="bar-new-container">

        <button type="button"
            class="focus:outline-none text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">+
            New
            Container</button>
    </div>
</div>

<!-- Card -->

<div class="card">
    <div class="max-w-sm p-6 bg-[#222931] border border-gray-200 rounded-lg shadow-sm">

        <!-- Ttitle and version -->
        <div class="flex items-center gap-2"> 
            <svg width="4em" height="4em" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M827.3 461.5c-1.6-1.3-16.1-12.2-46.7-12.2-8.1 0-16.2.6-24.2 2.1-5.9-40.7-39.5-60.5-41-61.4l-8.2-4.8-5.4 7.8c-6.8 10.5-11.7 22-14.6 34.2-5.5 23.2-2.2 45 9.6 63.6-14.2 7.9-37.1 9.9-41.7 10H277c-9.9 0-17.9 8-17.9 17.9-.4 33.1 5.2 66 16.5 97.1 13 34.2 32.4 59.3 57.6 74.7 28.2 17.3 74.1 27.2 126.2 27.2 23.5.1 47-2.1 70.1-6.4 32.1-5.9 63-17.1 91.4-33.2 23.4-13.6 44.5-30.8 62.4-51.1 29.9-33.9 47.8-71.7 61.1-105.2h5.3c32.8 0 53-13.1 64.1-24.1 7.4-7 13.2-15.5 16.9-25l2.3-6.9-5.7-4.3zM312 489.9h50.7c2.4 0 4.4-2 4.4-4.4v-45.1c0-2.4-2-4.4-4.4-4.5H312c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.5 2 4.4 4.4 4.4m69.9 0h50.7c2.4 0 4.4-2 4.4-4.4v-45.1c0-2.4-2-4.4-4.4-4.5h-50.7c-2.5 0-4.5 2-4.5 4.5v45.1c0 2.5 2 4.4 4.5 4.4m70.8.1h50.7c2.4 0 4.4-2 4.4-4.4v-45.1c0-2.4-2-4.4-4.4-4.5h-50.7c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.4 2 4.3 4.4 4.4m70.1 0h50.7c2.4 0 4.4-2 4.5-4.4v-45.1c0-2.5-2-4.5-4.5-4.5h-50.7c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.4 1.9 4.4 4.4 4.4m-141-65h50.7c2.4 0 4.4-2 4.4-4.5v-45.1c0-2.4-2-4.4-4.4-4.4h-50.7c-2.5 0-4.4 2-4.5 4.4v45.1c.1 2.5 2.1 4.5 4.5 4.5m70.9 0h50.7c2.4 0 4.4-2 4.4-4.5v-45.1c0-2.4-2-4.4-4.4-4.4h-50.7c-2.4 0-4.4 2-4.4 4.4v45.1c0 2.5 2 4.5 4.4 4.5m70.1 0h50.7c2.5 0 4.4-2 4.5-4.5v-45.1c0-2.5-2-4.4-4.5-4.4h-50.7c-2.4 0-4.4 2-4.4 4.4v45.1c0 2.5 1.9 4.5 4.4 4.5m0-64.9h50.7c2.5 0 4.5-2 4.5-4.5v-45.2c0-2.4-2-4.4-4.5-4.4h-50.7c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.5 1.9 4.5 4.4 4.5M593.4 490h50.7c2.4 0 4.4-2 4.4-4.4v-45.1c0-2.5-2-4.4-4.4-4.5h-50.7c-2.4 0-4.4 2-4.4 4.4v45.2c0 2.4 2 4.4 4.4 4.4"
                    style="fill:#fff" />
            </svg>
            <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Survival World</h5>
            <h6 class="mb-2 text-1xl font-bold tracking-tight text-gray-900 dark:text-gray-400">Forge 1.21</h6>
        </div>
        <div class="pb-10">
            <!-- Status:Running -->
            <div class="flex items-center gap-2">
                <p class="font-normal tracking-tight text-gray-900 dark:text-gray-400">
                    Status:
                </p>
                <div class="flex items-center gap-1">
                    <span class="text-green-600">Running</span>
                    <div class="w-2 h-2 rounded-full bg-green-600"></div>
                </div>
            </div>

            <!-- Image: test/survival:latest -->
            <div class="flex items-center gap-2">
                <p class="font-normal tracking-tight text-gray-900 dark:text-gray-400">
                    Image:
                </p>
                <div class="flex items-center gap-1">
                    <span class="text-gray-400">test/survival:latest</span>

                </div>
            </div>
        </div>
        <div class="flex gap-12">
            <div class="pb-10">
                <!-- Uptime:03:45:12 -->
                <div class="flex items-center gap-2">
                    <p class="font-normal tracking-tight text-gray-900 dark:text-gray-400">
                        Uptime:
                    </p>
                    <div class="flex items-center gap-1">
                        <span class="text-gray-400">03:45:12</span>
                    </div>
                </div>

                <!-- IP: play.serveur.me:25567/tcp -->
                <div class="flex items-center gap-2">
                    <p class="font-normal tracking-tight text-gray-900 dark:text-gray-400">
                        IP:
                    </p>
                    <div class="flex items-center gap-1">
                        <span class="text-gray-400">play.serveur.me:25567/tcp</span>
                    </div>
                </div>
            </div>

            <div>
                <!-- Players -->
                <div class="flex items-center gap-2">
                    <p class="font-normal tracking-tight text-gray-900 dark:text-gray-400">
                        Players
                    </p>
                </div>

                <!-- 2/20 -->
                <div class="flex items-center gap-2">
                    <p class="font-normal tracking-tight text-gray-900 dark:text-gray-400">
                        2/20
                    </p>

                </div>
            </div>
        </div>

        <!-- Boutons -->
        <div class="flex items-center gap-2 justify-between">
            <div class="flex gap-2">
                <!-- Stop -->

                <a href="#"
                    class="inline-flex items-center px-3 py-2 text-sm font-medium text-center text-white bg-[#5E656B] rounded-lg hover:bg-blue-800">
                    Stop
                </a>

                <!-- Restart -->
                <a href="#"
                    class="inline-flex items-center px-3 py-2 text-sm font-medium text-center text-white bg-[#5E656B] rounded-lg hover:bg-blue-800">
                    Restart
                </a>
            </div>
            <!-- Console -->
            <a href="#"
                class="inline-flex items-center px-3 py-2 text-sm font-medium text-center text-white bg-[#5E656B] rounded-lg hover:bg-blue-800">
                Console
            </a>
        </div>
    </div>
</div>
